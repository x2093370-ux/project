<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CloudVault</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<section id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="2" y="6" width="24" height="18" rx="3" stroke="currentColor" stroke-width="1.6"/><circle cx="14" cy="15" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M14 13.4v3.2M12.6 15h2.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>CloudVault</span>
    </div>
    <p class="auth-tagline">Store more, duplicate less.</p>
    <div class="auth-tabs">
      <button class="tab-btn active" data-tab="login">Log in</button>
      <button class="tab-btn" data-tab="register">Register</button>
    </div>
    <form id="login-form" class="auth-form">
      <label>Email<input type="email" id="login-email" required autocomplete="email" /></label>
      <label>Password<input type="password" id="login-password" required autocomplete="current-password" /></label>
      <button type="submit" class="primary-btn">Log in</button>
      <p class="form-error" id="login-error"></p>
    </form>
    <form id="register-form" class="auth-form hidden">
      <label>Name<input type="text" id="register-name" required /></label>
      <label>Email<input type="email" id="register-email" required autocomplete="email" /></label>
      <label>Password (6+ characters)<input type="password" id="register-password" required minlength="6" autocomplete="new-password" /></label>
      <button type="submit" class="primary-btn">Create account</button>
      <p class="form-error" id="register-error"></p>
    </form>
  </div>
</section>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 28 28" fill="none"><rect x="2" y="6" width="24" height="18" rx="3" stroke="currentColor" stroke-width="1.6"/><circle cx="14" cy="15" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M14 13.4v3.2M12.6 15h2.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>CloudVault</span>
    </div>

    <button id="new-folder-btn" class="side-action">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      New folder
    </button>
    <label class="side-action upload-label">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 11V3M4.5 6.5 8 3l3.5 3.5M3 13h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Upload files
      <input type="file" id="file-input" multiple hidden />
    </label>

    <div class="storage-meter">
      <div class="storage-bar"><div class="storage-fill" id="storage-fill"></div></div>
      <span id="storage-label" class="storage-label">Loading…</span>
      <div class="saved-box">
        <span class="saved-num" id="saved-num">0 B</span>
        <span class="saved-text">saved by deduplication</span>
      </div>
      <span id="ai-label" class="ai-label"></span>
    </div>

    <button id="logout-btn" class="side-action logout">Log out</button>
  </aside>

  <main class="main" id="drop-zone">
    <header class="topbar"><nav id="breadcrumb" class="breadcrumb"></nav></header>

    <div id="notice" class="notice hidden"></div>

    <div id="upload-progress" class="upload-progress hidden">
      <span id="upload-progress-label">Uploading…</span>
      <div class="progress-track"><div id="upload-progress-fill" class="progress-fill"></div></div>
    </div>

    <div id="dedup-panel" class="dedup-panel hidden">
      <div class="dedup-header">Possible duplicate content detected</div>
      <div id="dedup-list"></div>
    </div>

    <div id="item-list" class="item-list"></div>
    <p id="empty-state" class="empty-state hidden">This folder is empty. Drop files here, or use Upload files.</p>
  </main>
</div>

<div id="share-modal" class="modal hidden">
  <div class="modal-card">
    <h3>Share link</h3>
    <p id="share-item-name" class="modal-sub"></p>
    <label>Expires in
      <select id="share-expiry">
        <option value="24">24 hours</option>
        <option value="168">7 days</option>
        <option value="">Never</option>
      </select>
    </label>
    <button id="generate-link-btn" class="primary-btn">Generate link</button>
    <div id="share-link-result" class="share-link-result hidden">
      <input type="text" id="share-link-value" readonly />
      <button id="copy-link-btn">Copy</button>
    </div>
    <button id="close-share-modal" class="text-btn">Close</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
